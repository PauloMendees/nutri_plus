# Render Blueprint for the NutriPlus API.
# Secret VALUES are entered in the Render dashboard (sync: false), never here.
services:
  - type: web
    name: nutri-plus-api
    runtime: docker
    plan: starter
    # Co-locate with your Supabase project's region. Options include:
    # oregon | ohio | virginia | frankfurt | singapore
    region: oregon
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Runs once per release, before traffic switches to the new instance.
    # Reads DATABASE_URL via apps/api/prisma.config.ts.
    preDeployCommand: pnpm --filter @nutri-plus/api exec prisma migrate deploy
    envVars:
      # Supabase pooler (Supavisor) SESSION-mode URL — Render is IPv4-only and
      # the direct Supabase host is IPv6-only. Use port 5432 on
      # aws-0-<region>.pooler.supabase.com, NOT db.<ref>.supabase.co.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # The deployed web origin (drives CORS). Placeholder until the web is deployed.
      - key: WEB_ORIGIN
        sync: false
      # Opcional — sem valor no painel, valem os defaults de
      # apps/api/src/config/env.schema.ts. Preencher aqui sobrescreve o default,
      # então uma troca de modelo no código só vale se o campo estiver vazio.
      - key: OPENAI_MODEL_SMART
        sync: false
      - key: OPENAI_MODEL_FAST
        sync: false
      - key: OPENAI_MODEL_TRANSCRIBE
        sync: false
      # Segredo do endpoint interno de disparo de lembretes. O gatilho periódico
      # NÃO é um cron do Render — é um GitHub Actions agendado
      # (.github/workflows/reminders.yml) que faz POST em
      # /v1/internal/reminders/dispatch com o header x-reminder-key = este valor.
      - key: REMINDER_DISPATCH_KEY
        sync: false
      # --- Meta (Conversions API) ---
      # META_CAPI_ACCESS_TOKEN é o segredo: token do Gerenciador de Eventos,
      # preenchido só no painel. Sem pixel + token a CAPI fica desligada e o
      # rastreamento cai de volta para "Navegador" apenas.
      # META_CAPI_TEST_EVENT_CODE deve ficar VAZIO em produção — preenchido,
      # todos os eventos vão para a aba "Eventos de teste".
      - key: META_PIXEL_ID
        sync: false
      - key: META_CAPI_ACCESS_TOKEN
        sync: false
      - key: META_CAPI_TEST_EVENT_CODE
        sync: false
